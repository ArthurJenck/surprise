<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#9f91e8" />
        <meta
            name="robots"
            content="noindex, nofollow, noarchive, nosnippet, noimageindex"
        />
        <meta
            name="googlebot"
            content="noindex, nofollow, noarchive, nosnippet, noimageindex"
        />
        <meta name="description" content="Ouvrez pour une surprise !" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <title>Ouvrez pour une surprise !</title>
        <style>
            :root {
                color: #fff8e8;
                background: #9f91e8;
                font-family: Sora, Montserrat, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                min-width: 320px;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            body {
                background:
                    radial-gradient(
                        circle at 24% 15%,
                        rgba(221, 221, 255, 0.38),
                        transparent 38%
                    ),
                    radial-gradient(
                        circle at 78% 72%,
                        rgba(132, 105, 207, 0.2),
                        transparent 42%
                    ),
                    linear-gradient(
                        135deg,
                        #bab4f5 0%,
                        #aaa8f5 42%,
                        #8c76d8 100%
                    );
            }

            button,
            summary,
            a {
                font: inherit;
            }

            .static-fallback {
                position: fixed;
                z-index: 20;
                inset: 0;
                display: grid;
                place-items: center;
                padding: max(24px, env(safe-area-inset-top))
                    max(24px, env(safe-area-inset-right))
                    max(24px, env(safe-area-inset-bottom))
                    max(24px, env(safe-area-inset-left));
                color: #fff8e8;
                background:
                    radial-gradient(
                        circle at 24% 15%,
                        rgba(221, 221, 255, 0.38),
                        transparent 38%
                    ),
                    radial-gradient(
                        circle at 78% 72%,
                        rgba(132, 105, 207, 0.2),
                        transparent 42%
                    ),
                    linear-gradient(
                        135deg,
                        #bab4f5 0%,
                        #aaa8f5 42%,
                        #8c76d8 100%
                    );
            }

            .experience-ready .static-fallback {
                display: none;
            }

            .boot-loader {
                display: none;
            }

            .js-enabled .static-fallback {
                display: none;
            }

            .js-enabled .boot-loader {
                position: fixed;
                z-index: 30;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                color: #fff8e8;
                text-align: center;
                background:
                    radial-gradient(
                        circle at 24% 15%,
                        rgba(221, 221, 255, 0.38),
                        transparent 38%
                    ),
                    radial-gradient(
                        circle at 78% 72%,
                        rgba(132, 105, 207, 0.2),
                        transparent 42%
                    ),
                    linear-gradient(
                        135deg,
                        #bab4f5 0%,
                        #aaa8f5 42%,
                        #8c76d8 100%
                    );
            }

            .boot-loader__content {
                display: grid;
                gap: 14px;
                justify-items: center;
            }

            .boot-loader__eyebrow {
                margin: 0;
                font-size: 0.72rem;
                font-weight: 800;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .boot-loader__message {
                margin: 0;
                font-size: clamp(1.35rem, 6vw, 2.25rem);
                letter-spacing: -0.05em;
            }

            .boot-loader__indicator {
                width: min(180px, 48vw);
                height: 4px;
                overflow: hidden;
                background: rgba(255, 248, 232, 0.28);
                border-radius: 999px;
            }

            .boot-loader__indicator::before {
                display: block;
                width: 45%;
                height: 100%;
                content: '';
                background: #fff8e8;
                border-radius: inherit;
                animation: boot-loader-progress 1s ease-in-out infinite
                    alternate;
            }

            .boot-loader__failure {
                display: none;
                max-width: 22rem;
                margin: 0;
                line-height: 1.55;
            }

            .boot-loader__retry {
                display: none;
                padding: 11px 18px;
                color: #36235e;
                font-weight: 800;
                text-decoration: none;
                background: #fff8e8;
                border-radius: 999px;
            }

            .app-mounted .boot-loader {
                display: none;
            }

            .experience-bootstrap-failed .boot-loader__indicator,
            .experience-bootstrap-failed .boot-loader__message {
                display: none;
            }

            .experience-bootstrap-failed .boot-loader__failure,
            .experience-bootstrap-failed .boot-loader__retry {
                display: block;
            }

            @keyframes boot-loader-progress {
                to {
                    transform: translateX(120%);
                }
            }

            .static-fallback summary {
                display: grid;
                gap: 28px;
                justify-items: center;
                list-style: none;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }

            .static-fallback summary::-webkit-details-marker {
                display: none;
            }

            .fallback-gift {
                position: relative;
                width: min(44vw, 180px);
                aspect-ratio: 1;
                border-radius: 20%;
                background: #d9a84d;
                box-shadow:
                    0 30px 55px rgba(61, 39, 117, 0.26),
                    inset 0 2px 0 rgba(255, 255, 255, 0.2);
                transform: rotate(-3deg);
                transition: transform 500ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
            }

            .fallback-gift::before,
            .fallback-gift::after {
                position: absolute;
                content: '';
                background: #c9433c;
            }

            .fallback-gift::before {
                inset: 0 40%;
            }

            .fallback-gift::after {
                inset: 40% 0;
            }

            .fallback-bow,
            .fallback-bow::before,
            .fallback-bow::after {
                position: absolute;
                background: #d84b42;
            }

            .fallback-bow {
                z-index: 2;
                top: -8%;
                left: 50%;
                width: 18%;
                aspect-ratio: 1;
                border-radius: 50%;
                transform: translateX(-50%);
            }

            .fallback-bow::before,
            .fallback-bow::after {
                top: -45%;
                width: 140%;
                height: 110%;
                content: '';
                border-radius: 70% 35% 70% 35%;
            }

            .fallback-bow::before {
                right: 72%;
                transform: rotate(22deg);
            }

            .fallback-bow::after {
                left: 72%;
                transform: scaleX(-1) rotate(22deg);
            }

            .fallback-open-label {
                padding: 12px 20px;
                color: #36235e;
                font-size: 0.76rem;
                font-weight: 800;
                letter-spacing: 0.13em;
                text-transform: uppercase;
                background: rgba(255, 248, 232, 0.88);
                border-radius: 999px;
                box-shadow: 0 12px 30px rgba(61, 39, 117, 0.16);
            }

            .static-fallback[open] summary {
                display: none;
            }

            .fallback-reveal {
                width: min(620px, 100%);
                text-align: center;
                animation: fallback-reveal 500ms cubic-bezier(0.2, 0.8, 0.25, 1)
                    both;
            }

            .fallback-reveal h1 {
                margin: 0;
                font-size: clamp(2rem, 9vw, 4.6rem);
                font-weight: 800;
                line-height: 0.92;
                letter-spacing: -0.06em;
                text-transform: uppercase;
                text-wrap: balance;
            }

            .fallback-signature {
                margin: 28px 0 20px;
                font-size: clamp(0.86rem, 3vw, 1rem);
                font-weight: 600;
            }

            .fallback-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px 24px;
            }

            .fallback-links a {
                display: inline-block;
                color: inherit;
                font-size: 0.92rem;
                font-weight: 600;
                text-underline-offset: 5px;
                transition: transform 80ms ease-out;
            }

            .fallback-links a:hover,
            .fallback-links a:focus-visible {
                transform: scale(1.06);
            }

            .fallback-links a:active {
                transform: scale(0.94);
                transition-duration: 45ms;
            }

            @keyframes fallback-reveal {
                from {
                    opacity: 0;
                    transform: translateY(24px) scale(0.96);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .static-fallback,
                .fallback-gift,
                .fallback-reveal {
                    animation-duration: 1ms;
                }
            }
        </style>
        <script>
            document.documentElement.classList.add('js-enabled')
            window.showExperienceBootstrapError = function () {
                document.documentElement.classList.add(
                    'experience-bootstrap-failed'
                )
            }
        </script>
    </head>
    <body>
        <div id="app"></div>
        <section class="boot-loader" aria-live="polite" aria-busy="true">
            <div class="boot-loader__content">
                <h1 class="boot-loader__message">Chargement...</h1>
                <div class="boot-loader__indicator" aria-hidden="true"></div>
                <p class="boot-loader__failure">
                    Échec du chargement. Vérifiez votre connexion, puis relancez
                    la page.
                </p>
                <a class="boot-loader__retry" href="/">Réessayer</a>
            </div>
        </section>
        <details class="static-fallback">
            <summary aria-label="Voir la surprise">
                <span class="fallback-gift" aria-hidden="true"
                    ><span class="fallback-bow"></span
                ></span>
                <span class="fallback-open-label">Voir la surprise</span>
            </summary>
            <section class="fallback-reveal" aria-live="polite">
                <h1>
                    Félicitations,<br />vous avez gagné<br />un super
                    alternant&nbsp;!
                </h1>
                <p class="fallback-signature">
                    Arthur Jenck - Développeur créatif
                </p>
                <nav class="fallback-links" aria-label="Liens professionnels">
                    <a
                        href="https://arthurjenck.com"
                        target="_blank"
                        rel="noopener noreferrer"
                        >arthurjenck.com</a
                    >
                    <a
                        href="https://github.com/ArthurJenck"
                        target="_blank"
                        rel="noopener noreferrer"
                        >GitHub</a
                    >
                    <a
                        href="https://www.linkedin.com/in/arthurjenck/?skipRedirect=true"
                        target="_blank"
                        rel="noopener noreferrer"
                        >LinkedIn</a
                    >
                </nav>
            </section>
        </details>
        <script
            type="module"
            src="/src/main.ts"
            onerror="
                window.showExperienceBootstrapError &&
                    window.showExperienceBootstrapError()
            "
        ></script>
    </body>
</html>
